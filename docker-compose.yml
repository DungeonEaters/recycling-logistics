services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: recycling
      POSTGRES_PASSWORD: recycling
      POSTGRES_DB: recycling
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recycling"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://recycling:recycling@db:5432/recycling
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-me}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
      TZ: America/Santiago
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/srv
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 3s
      timeout: 3s
      retries: 30
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
