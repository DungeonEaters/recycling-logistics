name: CI and image build

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      component:
        description: Component image to publish
        required: true
        type: choice
        options: [all, api, web, mobile]
        default: all
      channel:
        description: Immutable release channel
        required: true
        type: choice
        options: [test, release]
        default: test
      version:
        description: Version suffix, for example 2026.10.09.1 or v0.1.0
        required: true
        type: string
      api_url:
        description: Public API URL embedded in web/mobile builds
        required: true
        type: string
        default: https://api.example.com

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ inputs.channel || 'validation' }}-${{ inputs.component || 'all' }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: pytest -q
        env:
          DATABASE_URL: "sqlite+pysqlite:///:memory:"

  web:
    name: Web (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build

  mobile:
    name: Mobile (test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  compose-smoke:
    name: Compose smoke
    runs-on: ubuntu-latest
    needs: [backend]
    steps:
      - uses: actions/checkout@v4
      - name: Start stack
        run: docker compose up -d --build --wait --wait-timeout 120
      - name: Health and login
        run: |
          curl -fsS http://localhost:8000/health
          curl -fsS -X POST http://localhost:8000/auth/login \
            -H 'content-type: application/json' \
            -d '{"email":"admin@demo.cl","password":"admin123"}' | grep -q access_token
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop stack
        if: always()
        run: docker compose down -v

  publish:
    name: Publish ${{ matrix.component }} (ARM64)
    needs: [backend, web, mobile, compose-smoke]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: api
            context: backend
            file: backend/Dockerfile
          - component: web
            context: web
            file: web/Dockerfile
          - component: mobile
            context: mobile
            file: mobile/Dockerfile
    steps:
      - if: inputs.component == 'all' || inputs.component == matrix.component
        uses: actions/checkout@v4
      - name: Validate version
        if: inputs.component == 'all' || inputs.component == matrix.component
        run: |
          test "${{ inputs.version }}" = "$(printf '%s' '${{ inputs.version }}' | tr -cd 'A-Za-z0-9._-')"
          test -n "${{ inputs.version }}"
      - id: image
        name: Derive lowercase image namespace
        if: inputs.component == 'all' || inputs.component == matrix.component
        run: echo "repository=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - if: inputs.component == 'all' || inputs.component == matrix.component
        uses: docker/setup-qemu-action@v3
      - if: inputs.component == 'all' || inputs.component == matrix.component
        uses: docker/setup-buildx-action@v3
      - if: inputs.component == 'all' || inputs.component == matrix.component
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: inputs.component == 'all' || inputs.component == matrix.component
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/arm64
          push: true
          build-args: |
            VITE_API_URL=${{ inputs.api_url }}
          tags: |
            ghcr.io/${{ steps.image.outputs.repository }}-${{ matrix.component }}:${{ inputs.channel }}-${{ inputs.version }}
            ghcr.io/${{ steps.image.outputs.repository }}-${{ matrix.component }}:sha-${{ github.sha }}
