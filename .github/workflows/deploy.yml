name: Build and deploy production

on:
  push:
    branches: [main]

concurrency:
  group: production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build ${{ matrix.component }} (ARM64)
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: api
            context: backend
            file: backend/Dockerfile
            build_args: ""
          - component: web
            context: web
            file: web/Dockerfile
            build_args: VITE_API_URL=https://api.${{ vars.PROD_APP_DOMAIN }}
          - component: mobile
            context: mobile
            file: mobile/Dockerfile
            build_args: VITE_API_URL=https://api.${{ vars.PROD_APP_DOMAIN }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate public production domain
        if: matrix.component != 'api'
        run: test -n "${{ vars.PROD_APP_DOMAIN }}"
      - id: image
        name: Derive lowercase image namespace
        run: echo "repository=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/arm64
          push: true
          build-args: ${{ matrix.build_args }}
          tags: |
            ghcr.io/${{ steps.image.outputs.repository }}-${{ matrix.component }}:sha-${{ github.sha }}
            ghcr.io/${{ steps.image.outputs.repository }}-${{ matrix.component }}:latest

  deploy:
    name: Deploy to Oracle Cloud
    runs-on: ubuntu-latest
    needs: build
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
      - name: Trust production host key
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "${{ secrets.PROD_SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Upload deployment manifests
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_USER: ${{ secrets.PROD_USER }}
          PROD_DEPLOY_PATH: ${{ vars.PROD_DEPLOY_PATH }}
        run: |
          # shellcheck disable=SC2029
          ssh "$PROD_USER@$PROD_HOST" "mkdir -p '$PROD_DEPLOY_PATH'"
          scp docker-compose.prod.yml Caddyfile "$PROD_USER@$PROD_HOST:$PROD_DEPLOY_PATH/"
      - name: Pull images and update services
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_USER: ${{ secrets.PROD_USER }}
          PROD_DEPLOY_PATH: ${{ vars.PROD_DEPLOY_PATH }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
          IMAGE_TAG: sha-${{ github.sha }}
        run: |
          # shellcheck disable=SC2029
          ssh "$PROD_USER@$PROD_HOST" \
            "PROD_DEPLOY_PATH='$PROD_DEPLOY_PATH' IMAGE_TAG='$IMAGE_TAG' GHCR_USERNAME='$GHCR_USERNAME' GHCR_PULL_TOKEN='$GHCR_PULL_TOKEN' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$PROD_DEPLOY_PATH"
          test -f .env || { echo "Missing $PROD_DEPLOY_PATH/.env"; exit 1; }
          grep -q '^IMAGE_REPOSITORY=' .env || { echo "IMAGE_REPOSITORY missing from .env"; exit 1; }

          if grep -q '^IMAGE_TAG=' .env; then
            sed -i "s/^IMAGE_TAG=.*/IMAGE_TAG=$IMAGE_TAG/" .env
          else
            printf '\nIMAGE_TAG=%s\n' "$IMAGE_TAG" >> .env
          fi

          printf '%s' "$GHCR_PULL_TOKEN" | docker login ghcr.io --username "$GHCR_USERNAME" --password-stdin
          docker compose --env-file .env -f docker-compose.prod.yml pull
          docker compose --env-file .env -f docker-compose.prod.yml up -d --remove-orphans
          docker image prune -f
          docker compose --env-file .env -f docker-compose.prod.yml ps
          REMOTE
